---
# Note that I use single quotes for the regexes, so the backslashed
# characters in them don't get interpreted by YAML as escapes (like
# \t).
#
# Also note that a noqa line is necessary here to stop ansible-lint
# from giving a warning about the use of tabs.  In general this is a
# bad idea, but here it is necessary.
- name: Modify rsyslog configuration
  ansible.builtin.lineinfile:  # noqa no-tabs
    path: /etc/logrotate.d/rsyslog
    regexp: "{{ item.regex }}"
    state: present
    line: "{{ item.line }}"
    backrefs: true
  loop:
    # Rotate log files daily
    #
    # yamllint complains about this quoted string, but single-quoting
    # it is the best way to avoid conflicts between YAML special
    # characters and regex special characters.
    # yamllint disable-line rule:quoted-strings
    - regex: '\s*weekly$'
      # yamllint complains about this quoted string, but we need to
      # use double-quotes because they allow us to use escape
      # sequences.
      #
      # yamllint disable-line rule:quoted-strings
      line: "\tdaily"
    # Keep seven days worth of logs
    #
    # yamllint complains about this quoted string, but single-quoting
    # it is the best way to avoid conflicts between YAML special
    # characters and regex special characters.
    # yamllint disable-line rule:quoted-strings
    - regex: '\s*rotate \d+$'
      # yamllint complains about this quoted string, but we need to
      # use double-quotes because they allow us to use escape
      # sequences.
      #
      # yamllint disable-line rule:quoted-strings
      line: "\trotate 7"
